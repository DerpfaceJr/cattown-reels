name: render-whatif4
on:
  push:
    branches: [main]
    paths: ['whatif4/**', '.github/workflows/whatif4.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-whatif4
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Pillow and numpy
        run: pip install "Pillow>=10.1" numpy
      - name: Render
        run: |
          mkdir -p docs
          echo "script chars: $(wc -c < whatif4/render_whatif4.py)" > docs/whatif4-log.txt
          set +e
          python whatif4/render_whatif4.py >> docs/whatif4-log.txt 2>&1
          echo "render exit code: $?" >> docs/whatif4-log.txt
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,sample_rate:format=duration,size -of default=nw=1 docs/whatif4.mp4 >> docs/whatif4-log.txt 2>&1 || echo "ffprobe failed" >> docs/whatif4-log.txt
          ls -la docs >> docs/whatif4-log.txt
          grep -E '^(LOOP|AUDIO)=' docs/whatif4-log.txt || echo "LOOP/AUDIO line missing"
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in docs/whatif4.mp4 docs/whatif4_cover.png docs/whatif4-log.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "Render whatif4 [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
