name: render-reel2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000/
      PORT: '3000'
      CAPTURE_SECS: '25'
    steps:
      - name: Check secret
        id: s
        env:
          TOKEN: ${{ secrets.CAT_TOWN_READ }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MISSING SECRET CAT_TOWN_READ"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == 'true'

      - name: Checkout cat-town app
        if: steps.s.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: DerpfaceJr/cat-town
          token: ${{ secrets.CAT_TOWN_READ }}
          path: app

      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == 'true'
        with:
          node-version: '20'

      - name: Install app
        if: steps.s.outputs.ok == 'true'
        working-directory: app
        run: npm ci

      - name: Start app in demo mode
        if: steps.s.outputs.ok == 'true'
        working-directory: app
        env:
          DEMO_MODE: '1'
        run: |
          nohup npm start > ../app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "$APP_URL" > /dev/null; then echo "APP UP after $((i*2)) s"; exit 0; fi
            sleep 2
          done
          echo "APP DID NOT START at $APP_URL"; tail -n 50 ../app.log; exit 1

      - name: Install Playwright Chromium
        if: steps.s.outputs.ok == 'true'
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Capture footage
        if: steps.s.outputs.ok == 'true'
        shell: bash
        run: node reel2/capture.mjs 2>&1 | tee reel2/out-capture-log.txt

      - uses: actions/setup-python@v5
        if: steps.s.outputs.ok == 'true'
        with:
          python-version: '3.11'

      - name: Install build tools
        if: steps.s.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install numpy pillow

      - name: Install Piper voice (optional; build.py falls back to espeak-ng)
        if: steps.s.outputs.ok == 'true'
        continue-on-error: true
        run: |
          pip install piper-tts==1.2.0
          mkdir -p reel2/voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ljspeech/medium
          curl -fsSL -o reel2/voices/en_US-ljspeech-medium.onnx "$base/en_US-ljspeech-medium.onnx"
          curl -fsSL -o reel2/voices/en_US-ljspeech-medium.onnx.json "$base/en_US-ljspeech-medium.onnx.json"

      - name: Build docs/reel2.mp4
        if: steps.s.outputs.ok == 'true'
        shell: bash
        env:
          APP_DIR: app
        run: |
          mkdir -p reel2/out
          python reel2/build.py 2>&1 | tee reel2/out/build-log.txt

      - name: Commit reel2.mp4
        if: steps.s.outputs.ok == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reel2.mp4
          if git diff --cached --quiet; then echo "NO CHANGE"; exit 0; fi
          git commit -m "reel2: render docs/reel2.mp4 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Collect logs
        if: always() && steps.s.outputs.ok == 'true'
        run: |
          mkdir -p reel2/out
          cp app.log reel2/out/app.log 2>/dev/null || true
          cp reel2/out-capture-log.txt reel2/out/capture-log.txt 2>/dev/null || true

      - name: Upload footage and logs
        if: always() && steps.s.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel2-footage
          path: reel2/out/
          if-no-files-found: warn
