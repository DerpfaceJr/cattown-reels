name: render
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Render
        run: |
          mkdir -p docs
          set +e
          python render.py > docs/render-log.txt 2>&1
          echo "render exit code: $?" >> docs/render-log.txt
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt:format=duration -of default=nw=1 docs/reel1.mp4 >> docs/render-log.txt 2>&1 || echo "ffprobe failed" >> docs/render-log.txt
          ls -la docs >> docs/render-log.txt
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Render reel1 [skip ci]" || echo "nothing to commit"
          git push
