name: fetch-reel2

# Copies the Reel 2 candidate mp4 (v7.1, src run 41263696548) from cat-town branch reels-out
# into the public docs/ folder. Uses repo contents read (CAT_TOWN_READ), not the Actions artifact API.
# Never posts anything. Writes docs/reel2-fetch-status.txt either way.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reel2/fetch-trigger.txt'

permissions:
  contents: write

concurrency:
  group: fetch-reel2
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SRC_REPO: DerpfaceJr/cat-town
      SRC_REF: reels-out
      SRC_PATH: reels-out/reel2.mp4
      WANT_BYTES: '3235091'
      WANT_SHA16: '7e5ce1f17c00bd4d'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout cat-town reels-out
        id: src
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: DerpfaceJr/cat-town
          ref: reels-out
          token: ${{ secrets.CAT_TOWN_READ }}
          path: src
          fetch-depth: 1
          sparse-checkout: |
            reels-out
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Copy and verify
        shell: bash
        env:
          SRC_OUTCOME: ${{ steps.src.outcome }}
        run: |
          mkdir -p docs
          S=docs/reel2-fetch-status.txt
          NOW=$(date -u +%FT%TZ)
          if [ "$SRC_OUTCOME" != "success" ]; then
            echo "status=CHECKOUT_FAILED utc=$NOW run=$GITHUB_RUN_ID src=$SRC_REPO@$SRC_REF outcome=$SRC_OUTCOME" > "$S"
            exit 0
          fi
          F="src/$SRC_PATH"
          if [ ! -f "$F" ]; then
            echo "status=NO_MP4_ON_REF utc=$NOW run=$GITHUB_RUN_ID src=$SRC_REPO@$SRC_REF files=$(find src -type f -not -path '*/.git/*' | head -n 20 | tr '\n' ' ')" > "$S"
            exit 0
          fi
          SRC_SHA=$(git -C src rev-parse --short HEAD 2>/dev/null || echo n/a)
          B=$(stat -c%s "$F")
          H=$(sha256sum "$F" | cut -c1-16)
          if [ "$B" != "$WANT_BYTES" ] || [ "$H" != "$WANT_SHA16" ]; then
            echo "status=MISMATCH utc=$NOW run=$GITHUB_RUN_ID src_commit=$SRC_SHA bytes=$B want=$WANT_BYTES sha256=$H want=$WANT_SHA16" > "$S"
            exit 0
          fi
          cp "$F" docs/reel2.mp4
          P=$(ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of compact docs/reel2.mp4 2>/dev/null | tr '\n' ' ' || echo n/a)
          echo "status=OK utc=$NOW run=$GITHUB_RUN_ID src=$SRC_REPO@$SRC_REF src_commit=$SRC_SHA src_run=41263696548 bytes=$B sha256=$H ffprobe=$P" > "$S"

      - name: Commit
        if: always()
        shell: bash
        run: |
          rm -rf src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reel2-fetch-status.txt
          if [ -f docs/reel2.mp4 ]; then git add docs/reel2.mp4; fi
          if git diff --cached --quiet; then echo "NO CHANGE"; exit 0; fi
          git commit -m "reel2: fetch status and mp4 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
