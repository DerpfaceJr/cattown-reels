name: render-whatif7
on:
  push:
    branches: [whatif7-staging]
    paths: ['whatif7/**', '.github/workflows/whatif7.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-whatif7
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Pillow and numpy
        run: pip install "Pillow>=10.1" numpy
      - name: Render
        run: |
          mkdir -p docs build
          echo "script chars: $(wc -c < whatif7/render_whatif7.py)" > docs/whatif7-log.txt
          set +e
          python whatif7/render_whatif7.py >> docs/whatif7-log.txt 2>&1
          echo "render exit code: $?" >> docs/whatif7-log.txt
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,sample_rate:format=duration,size -of default=nw=1 docs/whatif7.mp4 >> docs/whatif7-log.txt 2>&1 || echo "ffprobe failed" >> docs/whatif7-log.txt
          ls -la docs >> docs/whatif7-log.txt
          grep -E '^(SCRIPT_CHARS|AUDIO|PROBE)' docs/whatif7-log.txt || echo "SCRIPT_CHARS/AUDIO/PROBE line missing"
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in docs/whatif7.mp4 docs/whatif7_cover.png docs/whatif7-log.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "Render whatif7 [skip ci]" || echo "nothing to commit"
          git pull --rebase origin whatif7-staging || true
          git push origin HEAD:whatif7-staging
