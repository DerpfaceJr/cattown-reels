# live-reel v6 - capture live game footage frame by frame, cut a 15 s Reel, gate it (probe + motion + hero state), commit it.
# whatif6v-staging: record.mjs is patched in memory by live/patch6v.mjs (die mode, seeds, DEATH log), and
# live/shots6v.py picks the shot windows from the DEATH times (DEATHS_ON_SCREEN gate) when the config asks for it.
name: live-reel

on:
  workflow_dispatch:
    inputs:
      reel:
        description: Reel to render
        required: true
        type: choice
        options: [whatif2v, whatif6v, whatif7v]
  push:
    branches: [whatif2v-staging, whatif6v-staging, whatif7v-staging]

permissions:
  contents: write

concurrency:
  group: live-reel-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve reel
        id: reel
        env:
          INPUT_REEL: ${{ inputs.reel }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then R="$INPUT_REEL"; else R="${GITHUB_REF_NAME%-staging}"; fi
          [ -f "live/reels/$R.json" ] || { echo "unknown reel '$R'"; exit 1; }
          echo "reel=$R" >> "$GITHUB_OUTPUT"
          mkdir -p docs
          echo "RUN_ID=${{ github.run_id }} REEL=$R REF=$GITHUB_REF_NAME SHA=$GITHUB_SHA KIT=v6+patch6v-v2" | tee "docs/$R-log.txt"

      - name: Install tools
        run: |
          set -o pipefail
          npm i playwright@1.48 --no-save
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq
          ffmpeg -version | head -n1 | tee -a "docs/${{ steps.reel.outputs.reel }}-log.txt"
          node --version | tee -a "docs/${{ steps.reel.outputs.reel }}-log.txt"

      - name: Record takes
        id: record
        run: |
          set -o pipefail
          R=${{ steps.reel.outputs.reel }}
          node --import ./live/patch6v.mjs live/record.mjs "live/reels/$R.json" 2>&1 | tee -a "docs/$R-log.txt"

      - name: Plan shots
        id: shots
        if: always() && steps.record.outcome == 'success'
        run: |
          set -o pipefail
          R=${{ steps.reel.outputs.reel }}
          if [ -f live/shots6v.py ] && jq -e '.shots_from_deaths' "live/reels/$R.json" >/dev/null; then
            python3 live/shots6v.py "live/reels/$R.json" 2>&1 | tee -a "docs/$R-log.txt"
          else
            echo "SHOTS fixed (from config)" | tee -a "docs/$R-log.txt"
          fi

      - name: State gate
        id: state
        if: always() && steps.shots.outcome == 'success'
        run: |
          set -o pipefail
          R=${{ steps.reel.outputs.reel }}
          python3 live/stategate.py "live/reels/$R.json" 2>&1 | tee -a "docs/$R-log.txt"

      - name: Cut reel
        id: cut
        if: always() && steps.shots.outcome == 'success'
        run: |
          set -o pipefail
          R=${{ steps.reel.outputs.reel }}
          bash live/cut.sh "live/reels/$R.json" 2>&1 | tee -a "docs/$R-log.txt"

      - name: Probe
        id: probe
        if: always() && steps.cut.outcome == 'success'
        run: |
          set -o pipefail
          R=${{ steps.reel.outputs.reel }}
          bash live/probe.sh "live/reels/$R.json" 2>&1 | tee -a "docs/$R-log.txt"

      - name: Motion check
        id: motion
        if: always() && steps.cut.outcome == 'success'
        run: |
          set -o pipefail
          R=${{ steps.reel.outputs.reel }}
          python3 live/motion.py "live/reels/$R.json" 2>&1 | tee -a "docs/$R-log.txt"

      - name: Upload raw takes + docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reel-${{ steps.reel.outputs.reel }}-${{ github.run_id }}
          path: |
            out/raw
            docs
          if-no-files-found: warn

      # Always commit the log; commit the mp4 only when shots, probe, motion AND state passed.
      - name: Commit render
        if: always() && steps.reel.outputs.reel != ''
        env:
          R: ${{ steps.reel.outputs.reel }}
          SHOTS: ${{ steps.shots.outcome }}
          PROBE: ${{ steps.probe.outcome }}
          MOTION: ${{ steps.motion.outcome }}
          STATE: ${{ steps.state.outcome }}
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- live/reels 2>/dev/null || true
          echo "GATES shots=$SHOTS probe=$PROBE motion=$MOTION state=$STATE" | tee -a "docs/$R-log.txt"
          cp out/raw/status.json "docs/$R-status.json" 2>/dev/null || true
          git add "docs/$R-log.txt" "docs/$R-status.json" 2>/dev/null || git add "docs/$R-log.txt"
          git add "docs/$R-shots.json" 2>/dev/null || true
          PASS=no
          if [ "$SHOTS" = success ] && [ "$PROBE" = success ] && [ "$MOTION" = success ] && [ "$STATE" = success ]; then PASS=yes; git add "docs/$R.mp4"; else
            echo "mp4 NOT committed (gates failed)"
            git checkout -- "docs/$R.mp4" 2>/dev/null || true
          fi
          git commit -m "Render $R (live footage v6, frame-by-frame) [skip ci]" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          SHA=$(git rev-parse HEAD)
          echo "COMMIT $SHA"
          {
            echo "### $R  (shots: $SHOTS, probe: $PROBE, motion: $MOTION, state: $STATE)"
            echo "- log: https://raw.githubusercontent.com/${{ github.repository }}/$SHA/docs/$R-log.txt"
            [ "$PASS" = yes ] && echo "- mp4: https://raw.githubusercontent.com/${{ github.repository }}/$SHA/docs/$R.mp4"
          } >> "$GITHUB_STEP_SUMMARY"
