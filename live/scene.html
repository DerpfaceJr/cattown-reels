<!doctype html>
<!-- scene.html — self-contained fallback take: animated pixel-art dungeon (9:16), every frame changes. -->
<html><head><meta charset="utf-8"><title>whatif dungeon scene</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style></head>
<body><canvas id="c" width="180" height="320"></canvas>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const T = 20;
const MAP = [
  '####D####', '#.......#', 't.......t', '#.......#',
  '#..P.P..#', '#.......#', 't.....C.t', '#.......#',
  '#..P.P..#', '#.......#', 't.......t', '#.......#',
  '#..P.P..#', '#.......#', 't.......t', '#########',
];
const at = (x, y) => (MAP[y] || '')[x] || '#';
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const torches = [];
MAP.forEach((row, y) => [...row].forEach((c, x) => { if (c === 't') torches.push({ x, y, k: torches.length }); }));
const PATH = [[4, 14], [1, 13], [1, 9], [4, 9], [4, 5], [7, 5], [7, 2], [4, 2], [4, 1], [4, -0.7]];
const SPEED = 2.4;
const segs = PATH.slice(1).map((p, i) => { const a = PATH[i], dx = p[0] - a[0], dy = p[1] - a[1]; return { a, dx, dy, len: Math.hypot(dx, dy) }; });
const PATH_LEN = segs.reduce((s, q) => s + q.len, 0);
const CYCLE = PATH_LEN / SPEED + 1.2;
function heroAt(t) {
  let d = (t % CYCLE) * SPEED;
  if (d >= PATH_LEN) return { x: 4, y: -1, dx: 0, dy: -1, visible: false, moving: false };
  for (const s of segs) {
    if (d <= s.len) return { x: s.a[0] + s.dx * d / s.len, y: s.a[1] + s.dy * d / s.len, dx: s.dx, dy: s.dy, visible: true, moving: true };
    d -= s.len;
  }
  return { x: 4, y: -1, dx: 0, dy: -1, visible: false, moving: false };
}
const parts = [];
function spawn(x, y, vx, vy, life, col, size = 1) { parts.push({ x, y, vx, vy, life, max: life, col, size }); }
const motes = Array.from({ length: 40 }, (_, i) => ({ x: hash(i, 1) * 180, y: hash(i, 2) * 320, p: hash(i, 3) * 6.28 }));
let door = 0, last = performance.now(), stepT = 0;
const flick = (k, t) => 0.78 + 0.14 * Math.sin(t * 11 + k * 1.7) + 0.08 * Math.sin(t * 23.7 + k * 3.1) + 0.06 * Math.random();
function drawTile(x, y, c, t) {
  const px = x * T, py = y * T, v = hash(x, y);
  if (c === '#' || c === 't' || c === 'D') {
    g.fillStyle = '#3b3346'; g.fillRect(px, py, T, T);
    g.fillStyle = '#4c4259';
    for (let r = 0; r < 4; r++) g.fillRect(px + ((r & 1) ? 0 : 5), py + r * 5, 9, 4), g.fillRect(px + ((r & 1) ? 10 : 15), py + r * 5, (r & 1) ? 9 : 4, 4);
  } else {
    g.fillStyle = v < 0.5 ? '#2a2633' : '#2e2938'; g.fillRect(px, py, T, T);
    g.fillStyle = '#24202c'; g.fillRect(px, py + T - 1, T, 1); g.fillRect(px + T - 1, py, 1, T);
    if (v > 0.8) { g.fillStyle = '#3a3445'; g.fillRect(px + 4 + v * 8 | 0, py + 6, 3, 2); }
  }
  if (c === 'P') { g.fillStyle = '#5a5068'; g.fillRect(px + 4, py + 2, 12, 17); g.fillStyle = '#6e6380'; g.fillRect(px + 4, py + 2, 12, 3); }
  if (c === 'C') {
    g.fillStyle = '#7a4a22'; g.fillRect(px + 4, py + 8, 12, 9); g.fillStyle = '#c9952e'; g.fillRect(px + 4, py + 11, 12, 2); g.fillRect(px + 9, py + 10, 2, 4);
    if (Math.sin(t * 5) > 0.6) spawn(px + 6 + Math.random() * 8, py + 8, 0, -6, 0.6, '#ffe28a');
  }
  if (c === 'D') {
    g.fillStyle = '#05040a'; g.fillRect(px + 2, py + 2, 16, 18);
    g.fillStyle = `rgba(255,190,90,${0.5 * door})`; g.fillRect(px + 2, py + 2, 16, 18);
    const off = Math.round(door * 7);
    g.fillStyle = '#6b3f1f'; g.fillRect(px + 2 - off, py + 2, 8, 18); g.fillRect(px + 10 + off, py + 2, 8, 18);
    g.fillStyle = '#8a5a2c'; g.fillRect(px + 3 - off, py + 4, 6, 1); g.fillRect(px + 11 + off, py + 4, 6, 1);
    g.fillStyle = '#d8b04a'; g.fillRect(px + 8 - off, py + 11, 1, 2); g.fillRect(px + 11 + off, py + 11, 1, 2);
  }
}
function drawHero(h, t) {
  const px = Math.round(h.x * T + T / 2), py = Math.round(h.y * T + T / 2);
  const ph = Math.floor(t * 8) & 1, bob = h.moving ? ph : 0, face = h.dx < 0 ? -1 : 1;
  g.globalAlpha = Math.max(0, Math.min(1, h.y + 0.6));
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(px - 4, py + 6, 8, 2);
  g.fillStyle = '#2b5fa8'; g.fillRect(px - 3, py - 3 - bob, 6, 6);
  g.fillStyle = '#f2c9a0'; g.fillRect(px - 3, py - 8 - bob, 6, 5);
  g.fillStyle = '#5a3a1a'; g.fillRect(px - 3, py - 9 - bob, 6, 2);
  g.fillStyle = '#111'; g.fillRect(px + (face > 0 ? 1 : -2), py - 6 - bob, 1, 1);
  g.fillStyle = '#3a2a1a'; g.fillRect(px - 3, py + 3, 2, ph ? 3 : 2); g.fillRect(px + 1, py + 3, 2, ph ? 2 : 3);
  g.fillStyle = '#c0c8d0'; g.fillRect(px + face * 4, py - 4 - bob, 1, 6);
  g.globalAlpha = 1;
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  const hero = heroAt(t);
  const near = hero.visible && Math.hypot(hero.x - 4, hero.y) < 2.6;
  const prev = door; door += ((near ? 1 : 0) - door) * Math.min(1, dt * 4);
  if (Math.abs(door - prev) > 0.002) spawn(4 * T + 4 + Math.random() * 12, 18, (Math.random() - 0.5) * 20, -10, 0.8, '#ffcf6a');
  for (let y = 0; y < 16; y++) for (let x = 0; x < 9; x++) drawTile(x, y, at(x, y), t);
  if (hero.visible) drawHero(hero, t);
  stepT += dt;
  if (hero.moving && stepT > 0.22) { stepT = 0; spawn(hero.x * T + 10, hero.y * T + 17, (Math.random() - 0.5) * 8, -3, 0.5, '#8a8296'); }
  const fl = torches.map((tc) => flick(tc.k, t));
  for (let cy = 0; cy < 32; cy++) for (let cx = 0; cx < 18; cx++) {
    const x = (cx + 0.5) / 2, y = (cy + 0.5) / 2;
    let L = 0.16 + 0.04 * Math.sin(t * 1.3);
    torches.forEach((tc, i) => { L += Math.max(0, 1 - Math.hypot(x - tc.x - 0.5, y - tc.y - 0.5) / 4.2) * 0.6 * fl[i]; });
    if (hero.visible) L += Math.max(0, 1 - Math.hypot(x - hero.x - 0.5, y - hero.y - 0.5) / 2.8) * 0.5;
    L += door * Math.max(0, 1 - Math.hypot(x - 4.5, y - 0.5) / 3) * 0.5;
    g.fillStyle = `rgba(8,4,16,${Math.max(0, 1 - Math.min(1, L)).toFixed(3)})`;
    g.fillRect(cx * 10, cy * 10, 10, 10);
  }
  torches.forEach((tc, i) => {
    const px = tc.x * T + 10, py = tc.y * T + 8, h = 4 + Math.round(fl[i] * 4);
    g.fillStyle = '#5a3a1a'; g.fillRect(px - 1, py + 2, 3, 6);
    g.fillStyle = '#ff7a1a'; g.fillRect(px - 2, py + 2 - h, 5, h);
    g.fillStyle = '#ffd34a'; g.fillRect(px - 1, py + 3 - h + 2, 3, h - 2);
    if (Math.random() < 0.35) spawn(px + (Math.random() - 0.5) * 3, py - h, (Math.random() - 0.5) * 6, -14 - Math.random() * 10, 0.9, '#ffb040');
  });
  g.fillStyle = 'rgba(220,210,255,0.35)';
  motes.forEach((m) => { m.x = (m.x + dt * 3 + 180) % 180; m.y = (m.y - dt * 2 + 320) % 320; g.fillRect(m.x + Math.sin(t + m.p) * 2 | 0, m.y | 0, 1, 1); });
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    g.globalAlpha = p.life / p.max; g.fillStyle = p.col; g.fillRect(p.x | 0, p.y | 0, p.size, p.size);
  }
  g.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
